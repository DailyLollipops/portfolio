name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and regenerate
        run: node scripts/update-github-stats.mjs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit updated stats
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/github-stats.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh github stats"
            git push
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
          fi